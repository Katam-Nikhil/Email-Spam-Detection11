<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spam Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="mail-icon">✉</div>
    <h1>Spam Detection</h1>
    <p class="intro">Check whether a message looks like spam or genuine.</p>

    <label for="message">Enter your message</label>
    <textarea id="message" placeholder="Type or paste your message here..."></textarea>
    <button id="checkBtn">Check Message</button>

    <div id="result" class="result hidden" role="status" aria-live="polite"></div>
    <p class="footnote">Simple demo: checks for common spam words. It is not a trained AI model.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
